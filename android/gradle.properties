org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# KSP's Gradle plugin still registers its generated-sources directories via
# the classic kotlin.sourceSets DSL, which AGP's built-in Kotlin support
# (AGP 9+, see app/build.gradle.kts) rejects by default. This is the escape
# hatch AGP's own error message points at; safe here since KSP (Room's
# annotation processor) is the only thing touching that DSL.
android.disallowKotlinSourceSets=false
# com.google.ai.edge.litert:litert transitively depends on litert-api, and
# both AARs ship the same manifest namespace — an upstream LiteRT packaging
# bug against AGP 9's stricter duplicate-namespace check
# (github.com/google-ai-edge/LiteRT/issues/6965). This is Google's own
# documented temporary mitigation for that exact issue.
android.uniquePackageNames=false

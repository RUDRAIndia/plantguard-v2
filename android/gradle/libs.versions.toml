[versions]
# AGP / Kotlin / KSP / Compose BOM pinned to the exact versions this machine's
# Android Studio install already resolved successfully once (read from the
# local Gradle module cache) — this removes the single biggest source of
# first-sync failures for a beginner. Everything else below is current
# stable as of writing (Aug 2026); if Android Studio's sync flags a newer
# suggested version for one of these, take its suggestion.
agp = "9.3.1"
kotlin = "2.2.10"
ksp = "2.2.10-2.0.2"
composeBom = "2026.02.01"

coreKtx = "1.16.0"
activityCompose = "1.13.0"
lifecycle = "2.9.4"
navigationCompose = "2.9.7"
room = "2.8.4"
camerax = "1.5.1"
exifinterface = "1.4.1"
litert = "2.1.6"

junit = "4.13.2"
androidxJunit = "1.3.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }

androidx-exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exifinterface" }

# The real org.tensorflow.lite.Interpreter implementation lives in `litert`
# (litert-api only has the InterpreterApi *interface*). `litert` transitively
# depends on `litert-api`, and both AARs declare the same manifest namespace
# — a known upstream packaging bug against AGP 9's stricter duplicate-
# namespace check (google-ai-edge/LiteRT#6965, also hit by several other
# unrelated libraries under AGP 9). Mitigated via
# android.uniquePackageNames=false in gradle.properties.
litert = { group = "com.google.ai.edge.litert", name = "litert", version.ref = "litert" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# No org.jetbrains.kotlin.android entry: AGP 9+ has built-in Kotlin support,
# and applying the classic Kotlin Android plugin on top of it fails the
# build (see build.gradle.kts). kotlin-compose below still pins an exact
# Kotlin/Compose-compiler version.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
